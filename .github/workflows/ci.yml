name: Проверки
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: file:./data/ci.db
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: bash
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'SESSION_SECRET='+require('crypto').randomBytes(48).toString('hex')+'\n')"
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed && npm run db:seed:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/
